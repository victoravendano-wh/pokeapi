<!DOCTYPE html>
{% load staticfiles %}
<html lang="es" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{%block titulo%}Mi Pokédex{%endblock%}</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}" />
    <link rel="shortcut icon" href="{% static 'favicon/favicon.ico' %}" type="image/x-icon" />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <header>
      <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid position-relative">
          <a class="navbar-brand" href="{% url 'pokedex:index' %}">Inicio</a>
          <span class="navbar-text position-absolute start-50 translate-middle-x fw-bold h5 mb-0">{%block tituloNav%}Mi Pokédex{%endblock%}</span>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarTogglerDemo02" aria-controls="navbarTogglerDemo02" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
          <div class="collapse navbar-collapse" id="navbarTogglerDemo02">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="{% url 'pokedex:consultar_list' %}">Listar</a>
              </li>
              {% comment %} <li class="nav-item">
                <a class="nav-link" href="#">Link</a>
              </li> {% endcomment %}
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="d-flex justify-content-center align-items-center flex-column ">
      {% block main %}

      {% endblock %}
    </main>

    <footer>
      {% block footer %}

      {% endblock %}
    </footer>

    <script src="{% static 'js/bootstrap.js' %}"></script>
  </body>
</html>
